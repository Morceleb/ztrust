<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源加载中</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #1f2937;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            text-align: center;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 10px;
            color: #0f172a;
        }

        .status {
            font-size: 13px;
            color: #6b7280;
            margin: 0 0 18px;
        }

        .progress {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .progress::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 999px;
            background: #3b82f6;
            animation: pulse 1.4s ease-in-out infinite;
        }

        .target-url {
            font-size: 13px;
            color: #666;
            word-break: break-all;
            background: #f5f5f5;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-family: monospace;
        }


        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            background: #2563eb;
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:active {
            transform: scale(0.97);
        }

        button.secondary {
            background: #e5e7eb;
            color: #111827;
        }

        button.secondary:hover {
            background: #d1d5db;
        }

        @keyframes pulse {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(260%);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1 class="title">正在打开资源</h1>
            <p class="status" id="status">正在建立安全连接...</p>
            <div class="target-url" id="targetUrlDisplay"></div>
            <div class="progress" id="progress"></div>
            <div class="error" id="error"></div>
            <div class="actions" id="actions">
                <button id="retryBtn">手动请求资源</button>
                <button id="openOriginBtn" class="secondary">直接打开</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const baseUrl = params.get('baseUrl');
                const resourceId = params.get('resourceId');
                const authToken = params.get('authToken');
                const statusEl = document.getElementById('status');
                const progressEl = document.getElementById('progress');
                const errorEl = document.getElementById('error');
                const actionsEl = document.getElementById('actions');
                const retryBtn = document.getElementById('retryBtn');
                const openOriginBtn = document.getElementById('openOriginBtn');

                console.log('[Proxy] baseUrl:', baseUrl);
                console.log('[Proxy] resourceId:', resourceId);
                console.log('[Proxy] authToken present:', !!authToken);

                if (!baseUrl || !resourceId) {
                    document.getElementById('status').textContent = '缺少参数';
                    document.getElementById('error').textContent = 'URL 中缺少 baseUrl 或 resourceId';
                }

                const targetUrl = baseUrl && resourceId ? `${baseUrl}/auth/access/${resourceId}` : '';
                document.getElementById('targetUrlDisplay').textContent = targetUrl;

                const buildFetchOptions = () => {
                    const headers = new Headers();
                    headers.set('Accept', 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8');
                    headers.set('Accept-Language', 'zh-CN,zh;q=0.9,en;q=0.8');
                    if (authToken) {
                        headers.set('Authorization', `Bearer ${authToken}`);
                    }
                    return { headers, redirect: 'manual' };
                };

                const openOrigin = () => {
                    if (!baseUrl) return;
                    window.location.replace(baseUrl);
                };

                const setError = (message) => {
                    errorEl.textContent = message;
                    statusEl.textContent = '资源加载失败';
                    progressEl.style.display = 'none';
                    actionsEl.style.display = 'flex';
                };

                retryBtn.addEventListener('click', () => {
                    errorEl.textContent = '';
                    progressEl.style.display = 'block';
                    actionsEl.style.display = 'none';
                    loadResource();
                });

                openOriginBtn.addEventListener('click', openOrigin);

                const loadResource = async () => {
                    if (!baseUrl || !resourceId) {
                        setError('缺少目标地址参数');
                        return;
                    }

                    const targetUrl = `${baseUrl}/auth/access/${resourceId}`;
                    console.log('[Proxy] 目标地址:', targetUrl);

                    const req = new Request(targetUrl, buildFetchOptions());
                    console.log('[Proxy] 请求头:', Object.fromEntries(req.headers.entries()));

                    try {
                        statusEl.textContent = '正在请求目标资源...';
                        const response = await fetch(req);
                        statusEl.textContent = `收到响应: ${response.status}`;

                        if (response.status === 401 || response.status === 403) {
                            setError(`访问被拒绝（${response.status}），请重新登录后重试`);
                            return;
                        }

                        if (!response.ok) {
                            setError(`请求失败（${response.status} ${response.statusText}）`);
                            return;
                        }

                        const blob = await response.blob();

                        if (blob.type && !blob.type.includes('text') && !blob.type.includes('html') && !blob.type.includes('json') && !blob.type.includes('xml')) {
                            openOrigin();
                            return;
                        }

                        statusEl.textContent = '正在渲染页面...';
                        const objectUrl = URL.createObjectURL(blob);
                        window.location.replace(objectUrl);
                    } catch (error) {
                        setError(error?.message || '未知错误');
                    }
                };

                loadResource();
            } catch (e) {
                console.error('[Proxy] 初始化错误:', e);
                document.body.innerHTML = '<pre style="padding:20px">加载错误: ' + e.message + '</pre>';
            }
        });
    </script>
</body>

</html>
