appId: com.electron.app
productName: ztrust-new
electronVersion: 39.8.7

win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: ztrust-new

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always

# files 包含 out/ 编译产物和 node_modules（prebuild.js 已清理无用文件）
files:
  - out/**/*
  - node_modules/**/*
  - '!**/src/**'
  - '!**/.vscode/**'
  - '!**/.eslintrc*'
  - '!**/.prettierrc*'
  - '!**/dev-app-update.yml'
  - '!**/CHANGELOG.md'
  - '!**/README.md'
  - '!**/.env*'
  - '!**/.eslintcache'
  - '!**/electron.vite.config.*'
  - '!**/test/**'
  - '!**/__tests__/**'
  - '!**/demo/**'
  - '!**/example/**'
  - '!**/docs/**'
  - '!**/.github/**'

asar: true
npmRebuild: false
compression: normal

directories:
  output: dist
  buildResources: build

publish:
  provider: generic
  url: https://example.com/auto-updates
